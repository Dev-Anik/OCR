<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fast Digits OCR</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #121212;
      color: #fff;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
    }
    video {
      width: 100%;
      height: auto;
      background: #000;
      display: block;
    }
    .controls {
      margin: 1rem 0;
    }
    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: #fff;
      cursor: pointer;
    }
    button:disabled {
      background: #555;
    }
    #result {
      margin-top: 10px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #00ff66;
      min-height: 2rem;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <div class="video-container">
    <video id="webcam" autoplay playsinline></video>
  </div>

  <div class="controls">
    <button id="ocr-btn" disabled>Initializing Engine...</button>
  </div>

  <div>Extracted Digits:</div>
  <div id="result">--</div>

  <script>
    const video = document.getElementById('webcam');
    const ocrBtn = document.getElementById('ocr-btn');
    const resultDiv = document.getElementById('result');
    let worker = null;

    // Off-screen canvas to process captured video frame
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    // 1. Initialize Web Worker and constrain output strictly to Digits
    async function initOCR() {
      worker = await Tesseract.createWorker('eng');
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789', // Strict digit filtering
      });
      ocrBtn.disabled = false;
      ocrBtn.textContent = 'Scan Digits';
    }

    // 2. Request Mobile Camera Stream
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: 'environment' }, // Prefers back camera
            width: { ideal: 640 }                 // Keeps resolution manageable for low-end mobile
          },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert('Camera access denied or unassigned: ' + err.message);
      }
    }

    // 3. Perform Snapshot & OCR without interrupting video
    ocrBtn.addEventListener('click', async () => {
      if (!worker) return;

      ocrBtn.disabled = true;
      resultDiv.textContent = 'Scanning...';

      // Capture frame at low resolution for maximum speed on mobile CPU/GPU
      const targetWidth = 400; 
      const scale = targetWidth / video.videoWidth;
      canvas.width = targetWidth;
      canvas.height = video.videoHeight * scale;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Perform OCR asynchronously on worker thread (UI stays 60fps)
      const { data: { text } } = await worker.recognize(canvas);

      // Clean string of any unintended whitespace
      const cleanDigits = text.replace(/\D/g, '');
      resultDiv.textContent = cleanDigits.length ? cleanDigits : 'No digits found';

      ocrBtn.disabled = false;
    });

    // Run Initializations
    initCamera();
    initOCR();
  </script>
</body>
</html>
