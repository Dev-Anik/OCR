<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>High Performance Digit OCR</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #121212;
      color: #fff;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4 / 3;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    /* EXPANDED RED SCANNING ZONE */
    .scan-line-gate {
      position: absolute;
      top: 50%;
      left: 8%;
      width: 84%;
      height: 90px; /* INCREASED HEIGHT (Easier aiming, farther camera distance) */
      border: 3px solid #ff4d4d;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(255, 77, 77, 0.6);
      transform: translateY(-50%);
      box-sizing: border-box;
      pointer-events: none;
      z-index: 10;
    }

    .controls { margin: 1rem 0; }
    button {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #555; }
    #result {
      margin-top: 10px;
      font-size: 1.8rem;
      font-weight: bold;
      color: #00ff66;
      min-height: 2.2rem;
      background: rgba(255,255,255,0.1);
      padding: 10px 24px;
      border-radius: 8px;
    }
    .invalid { color: #ff4d4d !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <div class="video-container" id="container">
    <video id="webcam" autoplay playsinline></video>
    <div class="scan-line-gate" id="gate"></div>
  </div>

  <div class="controls">
    <button id="ocr-btn" disabled>Initializing Engine...</button>
  </div>

  <div id="result">--</div>

  <script>
    const video = document.getElementById('webcam');
    const container = document.getElementById('container');
    const gate = document.getElementById('gate');
    const ocrBtn = document.getElementById('ocr-btn');
    const resultDiv = document.getElementById('result');
    let worker = null;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    async function initOCR() {
      worker = await Tesseract.createWorker('eng');
      await worker.setParameters({
        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE,
        tessedit_char_whitelist: '0123456789',
      });
      ocrBtn.disabled = false;
      ocrBtn.textContent = 'Scan Digits';
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 }, // Higher native stream resolution for far reading
            height: { ideal: 1080 },
            focusMode: { ideal: 'continuous' } // Triggers auto-focus on mobile devices
          },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert('Camera error: ' + err.message);
      }
    }

    // Adaptive contrast filter: improves accuracy when scanning from a distance
    function preprocessImage(canvasContext, width, height) {
      const imgData = canvasContext.getImageData(0, 0, width, height);
      const data = imgData.data;

      // Grayscale conversion
      for (let i = 0; i < data.length; i += 4) {
        const v = 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
        data[i] = data[i + 1] = data[i + 2] = v;
      }

      // High contrast boost without aggressive threshold clipping
      const contrast = 1.5; 
      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
      for (let i = 0; i < data.length; i += 4) {
        data[i] = factor * (data[i] - 128) + 128;
        data[i + 1] = data[i];
        data[i + 2] = data[i];
      }

      canvasContext.putImageData(imgData, 0, 0);
    }

    ocrBtn.addEventListener('click', async () => {
      if (!worker || video.readyState !== 4) return;

      ocrBtn.disabled = true;
      resultDiv.className = '';
      resultDiv.textContent = 'Scanning...';

      // Precise Coordinate Mapping based on CSS Bounding Rectangles
      const cRect = container.getBoundingClientRect();
      const gRect = gate.getBoundingClientRect();

      // Ratio of real stream dimensions vs rendered UI element dimensions
      const scaleX = video.videoWidth / cRect.width;
      const scaleY = video.videoHeight / cRect.height;

      // Calculate exact video crop box matching the visible Red Box
      const cropX = (gRect.left - cRect.left) * scaleX;
      const cropY = (gRect.top - cRect.top) * scaleY;
      const cropWidth = gRect.width * scaleX;
      const cropHeight = gRect.height * scaleY;

      // SPEED & DISTANCE FIX: Limit max processing canvas width to 500px.
      // Downscaling large cropped captures speeds up Tesseract 3x-5x on low-end CPUs
      const targetWidth = 500;
      const scaleDownRatio = targetWidth / cropWidth;
      
      canvas.width = targetWidth;
      canvas.height = cropHeight * scaleDownRatio;

      // Draw cropped area resized directly onto scaled canvas
      ctx.drawImage(
        video,
        cropX, cropY, cropWidth, cropHeight,
        0, 0, canvas.width, canvas.height
      );

      // Enhance text contrast for small distant characters
      preprocessImage(ctx, canvas.width, canvas.height);

      const { data } = await worker.recognize(canvas);
      const digitsOnly = data.text.replace(/\D/g, '').trim();

      // Validate engine confidence & reject false positive noise
      if (digitsOnly.length === 0 || data.confidence < 45) {
        resultDiv.textContent = 'Invalid Data';
        resultDiv.className = 'invalid';
      } else {
        resultDiv.textContent = digitsOnly;
      }

      ocrBtn.disabled = false;
    });

    initCamera();
    initOCR();
  </script>
</body>
</html>
