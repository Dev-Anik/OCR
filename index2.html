<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accurate Line OCR</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #121212;
      color: #fff;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      /* Ensure the container maintains aspect ratio */
      aspect-ratio: 4 / 3; 
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ensures video fills container without stretching */
      display: block;
    }
    
    /* THE RED SCANNING LINE AREA */
    .scan-line-gate {
      position: absolute;
      /* Centered vertically and horizontally */
      top: 50%;
      left: 10%;
      /* Wide but very thin */
      width: 80%;
      height: 40px; /* One line height */
      /* Visual style */
      border: 2px solid #ff4d4d;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
      
      /* Center alignment transform */
      transform: translateY(-50%);
      box-sizing: border-box;
      pointer-events: none; /* Let clicks pass through to video/buttons */
      z-index: 10;
    }

    .controls { margin: 1rem 0; }
    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #555; }
    #result {
      margin-top: 10px;
      font-size: 1.8rem;
      font-weight: bold;
      color: #00ff66;
      min-height: 2.2rem;
      background: rgba(255,255,255,0.1);
      padding: 10px 20px;
      border-radius: 8px;
    }
    .invalid { color: #ff4d4d !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <div class="video-container">
    <video id="webcam" autoplay playsinline></video>
    <!-- The targeted scanning area -->
    <div class="scan-line-gate"></div>
  </div>

  <div class="controls">
    <button id="ocr-btn" disabled>Loading...</button>
  </div>

  <div id="result">--</div>

  <script>
    const video = document.getElementById('webcam');
    const ocrBtn = document.getElementById('ocr-btn');
    const resultDiv = document.getElementById('result');
    let worker = null;

    // The preprocessing canvas
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    async function initOCR() {
      worker = await Tesseract.createWorker('eng');
      // Force single-line mode for max accuracy in the thin gate
      await worker.setParameters({
        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE,
        tessedit_char_whitelist: '0123456789', // Optional: Keep this if you ONLY want digits
      });
      ocrBtn.disabled = false;
      ocrBtn.textContent = 'Scan Red Area';
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
          audio: false
        });
        video.srcObject = stream;
        
        // Ensure canvas matches the video aspect ratio when metadata loads
        video.onloadedmetadata = () => {
          console.log(`Video dimensions: ${video.videoWidth}x${video.videoHeight}`);
        };
      } catch (err) {
        alert('Camera error: ' + err.message);
      }
    }

    // Image Preprocessing Filter (unchanged)
    function preprocessImage(canvasContext, width, height) {
      const imgData = canvasContext.getImageData(0, 0, width, height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const avg = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        const threshold = avg > 130 ? 255 : 0; // Slightly higher threshold
        data[i] = data[i + 1] = data[i + 2] = threshold;
      }
      canvasContext.putImageData(imgData, 0, 0);
    }

    ocrBtn.addEventListener('click', async () => {
      if (!worker || video.readyState !== 4) return;

      ocrBtn.disabled = true;
      resultDiv.className = '';
      resultDiv.textContent = 'Processing...';

      // 1. CALCULATE CROP COORDINATES
      // We need to map the CSS coordinates (.scan-line-gate) 
      // back to the actual video pixel dimensions.
      
      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      
      // These percentages MUST match the .scan-line-gate CSS
      const gateWidthPercent = 0.80;  // 80%
      const gateHeightPxCSS = 40;     // 40px height in CSS
      const gateLeftPercent = 0.10;  // 10%
      
      // Calculate the display height of the video container (to find the scaling factor)
      const displayHeight = video.clientHeight;
      const scaleFactor = vHeight / displayHeight;
      
      // Map the 40px CSS height to actual video pixels
      const gateHeightVideoPixels = gateHeightPxCSS * scaleFactor;
      
      const cropX = vWidth * gateLeftPercent;
      const cropY = (vHeight / 2) - (gateHeightVideoPixels / 2); // Centered vertically
      const cropWidth = vWidth * gateWidthPercent;
      const cropHeight = gateHeightVideoPixels;

      // 2. SET CANVAS SIZE TO MATCH THE THIN GATE
      canvas.width = cropWidth;
      canvas.height = cropHeight;

      // 3. DRAW ONLY THE RED AREA PIXELS
      ctx.drawImage(
        video, 
        cropX, cropY, cropWidth, cropHeight, // Source (the video frame)
        0, 0, cropWidth, cropHeight          // Destination (the small canvas)
      );
      
      // 4. ENHANCE (Grayscale/Binarize)
      preprocessImage(ctx, canvas.width, canvas.height);

      // 5. OCR THE TINY IMAGE
      const { data } = await worker.recognize(canvas);
      
      // Clean result (optional, depends if you kept whitelist active)
      const resultText = data.text.trim().replace(/\D/g, '');

      // 6. VALIDATE AND SHOW OUTPUT
      // Since the image is so small, Tesseract is very fast.
      if (resultText.length === 0 || data.confidence < 50) {
        resultDiv.textContent = 'Invalid Data';
        resultDiv.className = 'invalid';
      } else {
        resultDiv.textContent = resultText;
      }

      ocrBtn.disabled = false;
    });

    initCamera();
    initOCR();
  </script>
</body>
</html>
