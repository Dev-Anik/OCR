<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accurate Digits OCR</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #121212;
      color: #fff;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
    }
    video {
      width: 100%;
      height: auto;
      background: #000;
      display: block;
    }
    /* Visual target guide box for user aiming */
    .scan-box {
      position: absolute;
      top: 30%;
      left: 15%;
      width: 70%;
      height: 40%;
      border: 2px dashed #00ff66;
      border-radius: 8px;
      box-sizing: border-box;
      pointer-events: none;
    }
    .controls { margin: 1rem 0; }
    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #555; }
    #result {
      margin-top: 10px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #00ff66;
      min-height: 2rem;
    }
    .invalid { color: #ff4d4d !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <div class="video-container">
    <video id="webcam" autoplay playsinline></video>
    <div class="scan-box"></div>
  </div>

  <div class="controls">
    <button id="ocr-btn" disabled>Loading Engine...</button>
  </div>

  <div>Extracted Digits:</div>
  <div id="result">--</div>

  <script>
    const video = document.getElementById('webcam');
    const ocrBtn = document.getElementById('ocr-btn');
    const resultDiv = document.getElementById('result');
    let worker = null;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    async function initOCR() {
      worker = await Tesseract.createWorker('eng');
      // Set single line mode for cleaner digit parsing
      await worker.setParameters({
        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE,
      });
      ocrBtn.disabled = false;
      ocrBtn.textContent = 'Scan Digits';
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert('Camera error: ' + err.message);
      }
    }

    // Image Preprocessing: Grayscale & High Contrast Binarization
    function preprocessImage(canvasContext, width, height) {
      const imgData = canvasContext.getImageData(0, 0, width, height);
      const data = imgData.data;
      
      for (let i = 0; i < data.length; i += 4) {
        // Calculate grayscale luminosity
        const avg = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        // Apply crisp black & white threshold (removes background noise)
        const threshold = avg > 120 ? 255 : 0;
        data[i] = data[i + 1] = data[i + 2] = threshold;
      }
      canvasContext.putImageData(imgData, 0, 0);
    }

    ocrBtn.addEventListener('click', async () => {
      if (!worker) return;

      ocrBtn.disabled = true;
      resultDiv.className = '';
      resultDiv.textContent = 'Scanning...';

      // Crop canvas to match the scan-box target area for speed & focus
      const boxWidth = video.videoWidth * 0.7;
      const boxHeight = video.videoHeight * 0.4;
      const startX = video.videoWidth * 0.15;
      const startY = video.videoHeight * 0.3;

      canvas.width = boxWidth;
      canvas.height = boxHeight;

      // Draw cropped area to off-screen canvas
      ctx.drawImage(video, startX, startY, boxWidth, boxHeight, 0, 0, boxWidth, boxHeight);
      
      // Enhance image for mobile OCR accuracy
      preprocessImage(ctx, canvas.width, canvas.height);

      const { data } = await worker.recognize(canvas);
      const rawText = data.text.trim();
      
      // Validation Check: Ensure text contains actual digits and passed confidence checks
      const containsNonDigits = /[a-zA-Z]/.test(rawText);
      const digitsOnly = rawText.replace(/\D/g, '');

      // Reject if non-numeric characters detected, confidence is low, or no digits were found
      if (containsNonDigits || digitsOnly.length === 0 || data.confidence < 60) {
        resultDiv.textContent = 'Invalid Data';
        resultDiv.className = 'invalid';
      } else {
        resultDiv.textContent = digitsOnly;
      }

      ocrBtn.disabled = false;
    });

    initCamera();
    initOCR();
  </script>
</body>
</html>
